name: exo3

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement à déployer'
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: application
          path: dist/
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test (${{ matrix.os }} - Node ${{ matrix.node-version }})
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Configurer Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      - name: Télécharger l'artefact application
        uses: actions/download-artifact@v7
        with:
          name: application
          path: dist/

      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: 
      name: ${{ inputs.environment }}
      url: ${{ vars.API_URL }}

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: application
          path: dist/

      - name: Simuler le déploiement
        run: echo "Déploiement vers ${{ vars.API_URL }}"
        
      - name: Produire le résumé
        shell: bash
        run: |
          echo "## Résumé du déploiement" >> $GITHUB_STEP_SUMMARY
          echo "- **Environnement cible** : \`${{ inputs.environment }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL de l'API** : ${{ vars.API_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit** : \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY