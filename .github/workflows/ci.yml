name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
    
      - uses : actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - run: npm test

      - if: always()
        run: |
          echo "### Résultat du workflow" >> $GITHUB_STEP_SUMMARY
          echo "- **Statut du job** : ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref du commit** : \`${{ github.ref }}\` (\`${{ github.sha }}\`)" >> $GITHUB_STEP_SUMMARY