name: exo2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - run: |
          if [ ! -d "dist" ]; then
            echo "Erreur : le dossier dist/ n'a pas été généré."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/
          retention-days: 7

      - if: always()
        run: |
          echo "## Résumé du build" >> $GITHUB_STEP_SUMMARY
          echo "- **Déclenché par** : ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branche** : \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit** : \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Statut final** : ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "dist" ]; then
            echo "### Contenu de l'artefact \`dist/\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Taille totale** : $(du -sh dist \vert{} cut -f1)" >> $GITHUB_STEP_SUMMARY
            echo "- **Fichiers générés** :" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            ls -lh dist >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi